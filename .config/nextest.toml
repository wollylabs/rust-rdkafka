# cargo-nextest configuration. wolly-ci's ci-rust runs `--profile ci`.
#
# A test still running after period × terminate-after is killed and failed, so a test that
# blocks on an unreachable broker is a fast failure rather than a hang.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }
